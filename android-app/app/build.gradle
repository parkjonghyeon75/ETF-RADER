plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.etfradar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.etfradar.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Java와 Kotlin의 JVM 대상 버전을 17로 통일합니다.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
